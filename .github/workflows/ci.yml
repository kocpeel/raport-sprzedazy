name: Testy i demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python -m raport --dane przyklad/dane --wyjscie wynik
      - name: Przygotuj stronę demo
        run: |
          mkdir strona
          cp wynik/raport.html strona/index.html
          cp wynik/raport.xlsx strona/raport.xlsx
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: strona

  deploy-demo:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
